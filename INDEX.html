<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BalisagePro</title>
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Html5-Qrcode pour le scanner -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <!-- PapaParse pour lire le fichier CSV -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <!-- SheetJS (XLSX) pour l'export Excel 5.0/95 (BIFF5) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            brand: { 500: '#2563EB', 600: '#1D4ED8' }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased pb-20">

  <!-- Entête -->
  <header class="bg-white border-b border-gray-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <div class="w-8 h-8 bg-brand-500 rounded-lg flex items-center justify-center text-white font-bold shadow-md">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h10M7 12h10m-7 5h7"></path>
          </svg>
        </div>
        <div>
          <h1 class="text-lg font-bold text-gray-900 leading-none">BalisagePro</h1>
          <p class="text-xs text-gray-500 mt-0.5" id="header-store-name">Magasin non configuré</p>
        </div>
      </div>
      <div id="sync-badge" class="flex items-center space-x-1 bg-green-50 text-green-700 px-2 py-1 rounded-full text-xs font-medium border border-green-200">
        <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
        <span id="sync-badge-text">Prêt</span>
      </div>
    </div>
  </header>

  <!-- Contenu Principal -->
  <main class="max-w-md mx-auto p-4 space-y-4">

    <!-- ONGLET 1 : RECHERCHE -->
    <section id="tab-search" class="tab-content active space-y-4">
      <!-- Zone de Recherche -->
      <div class="bg-white rounded-xl p-4 border border-gray-100 shadow-sm space-y-3">
        <div class="relative">
          <input type="text" id="search-input" placeholder="Code article..." class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white text-sm" oninput="searchArticle()">
          <svg class="w-5 h-5 text-gray-400 absolute left-3 top-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
        </div>
        <button id="btn-toggle-scan" onclick="toggleScanner()" class="w-full bg-brand-500 hover:bg-brand-600 text-white font-medium py-2.5 px-4 rounded-lg flex items-center justify-center space-x-2 shadow-sm transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h0.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path>
          </svg>
          <span id="scan-btn-text">Scanner un code</span>
        </button>
        <div id="reader" class="w-full rounded-lg overflow-hidden hidden border mt-2"></div>
      </div>

      <!-- Résultat de la Recherche -->
      <div id="search-results" class="space-y-3"></div>
    </section>

    <!-- ONGLET 2 : LISTES DE BALISAGE -->
    <section id="tab-lists" class="tab-content space-y-4">
      <!-- Créer une liste -->
      <div class="bg-white rounded-xl p-4 border border-gray-100 shadow-sm space-y-3">
        <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider">Créer une nouvelle liste</label>
        <div class="flex space-x-2">
          <input type="text" id="new-list-name" placeholder="Nom de la liste..." class="flex-1 px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
          <button onclick="createNewList()" class="bg-brand-500 hover:bg-brand-600 text-white font-medium px-4 py-2 rounded-lg text-sm transition">Créer</button>
        </div>
      </div>

      <!-- Sélection et Actions -->
      <div class="bg-white rounded-xl p-4 border border-gray-100 shadow-sm space-y-3">
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Liste active</label>
          <select id="active-list-select" onchange="switchActiveList()" class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-lg text-sm font-medium text-gray-800 focus:outline-none focus:ring-2 focus:ring-brand-500"></select>
        </div>

        <div class="grid grid-cols-2 gap-2 pt-1">
          <button onclick="sendByEmail()" class="w-full bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-medium py-2 px-3 rounded-lg text-xs flex items-center justify-center space-x-1 border border-indigo-200 transition">
            <span>✉️ Envoyer Mail</span>
          </button>
          <button onclick="saveToGitHub()" class="w-full bg-gray-800 hover:bg-gray-900 text-white font-medium py-2 px-3 rounded-lg text-xs flex items-center justify-center space-x-1 transition">
            <span>💾 Backup GitHub</span>
          </button>
        </div>
        <button onclick="exportExcel5()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 px-4 rounded-lg text-xs flex items-center justify-center space-x-2 shadow-sm transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
          <span>Télécharger Excel (5.0/95)</span>
        </button>
      </div>

      <!-- Articles dans la liste -->
      <div class="bg-white rounded-xl p-4 border border-gray-100 shadow-sm space-y-2">
        <h3 class="text-xs font-semibold text-gray-500 uppercase tracking-wider border-b pb-2">Articles enregistrés</h3>
        <div id="active-list-items" class="divide-y divide-gray-100"></div>
      </div>
    </section>

    <!-- ONGLET 3 : PARAMÈTRES -->
    <section id="tab-settings" class="tab-content space-y-4">
      <div class="bg-white rounded-xl p-4 border border-gray-100 shadow-sm space-y-4">
        <h2 class="text-xs font-semibold text-gray-500 uppercase tracking-wider border-b pb-2">Configuration Générale</h2>
        
        <div>
          <label class="block text-xs font-medium text-gray-700 mb-1">Nom du magasin</label>
          <input type="text" id="setting-store-name" class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand-500" placeholder="Ex: Magasin Central">
        </div>

        <div>
          <label class="block text-xs font-medium text-gray-700 mb-1">Email destinataire</label>
          <input type="email" id="setting-target-email" class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand-500" placeholder="balisage@magasin.com">
        </div>

        <h2 class="text-xs font-semibold text-gray-500 uppercase tracking-wider border-b pb-2 pt-2">Source des données (GitHub CSV)</h2>

        <div>
          <label class="block text-xs font-medium text-gray-700 mb-1">URL du fichier stock.csv (Raw)</label>
          <input type="url" id="setting-stock-url" class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand-500" placeholder="https://raw.githubusercontent.com/user/repo/main/stock.csv">
        </div>

        <div>
          <label class="block text-xs font-medium text-gray-700 mb-1">Jeton GitHub (Personal Access Token)</label>
          <input type="password" id="setting-github-token" class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand-500" placeholder="ghp_xxxxxxxxxxxx">
        </div>

        <div>
          <label class="block text-xs font-medium text-gray-700 mb-1">Dépôt GitHub (User/Repo)</label>
          <input type="text" id="setting-github-repo" class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand-500" placeholder="utilisateur/depot">
        </div>

        <button onclick="saveSettings()" class="w-full bg-brand-500 hover:bg-brand-600 text-white font-medium py-2.5 rounded-lg text-sm shadow-sm transition">
          Enregistrer les paramètres
        </button>
      </div>

      <div class="bg-white rounded-xl p-4 border border-gray-100 shadow-sm space-y-2">
        <button onclick="syncStockFromGitHub()" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-medium py-2 rounded-lg text-xs transition">
          🔄 Forcer la synchronisation du CSV
        </button>
        <p class="text-[11px] text-gray-400 text-center" id="sync-status">Dernière synchro : Non effectuée</p>
      </div>
    </section>

  </main>

  <!-- Navigation Basse Fixe -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 z-30">
    <div class="max-w-md mx-auto flex justify-around py-2 px-4">
      <button onclick="switchTab('search')" id="nav-search" class="flex flex-col items-center text-brand-500 font-semibold text-xs space-y-1">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        <span>Recherche</span>
      </button>
      <button onclick="switchTab('lists')" id="nav-lists" class="flex flex-col items-center text-gray-400 hover:text-gray-600 text-xs space-y-1">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
        <span>Listes</span>
      </button>
      <button onclick="switchTab('settings')" id="nav-settings" class="flex flex-col items-center text-gray-400 hover:text-gray-600 text-xs space-y-1">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
        <span>Paramètres</span>
      </button>
    </div>
  </nav>

  <!-- LOGIQUE JS -->
  <script>
    let stockData = [];
    let lists = JSON.parse(localStorage.getItem('app_lists')) || { "Liste Par Défaut": [] };
    let activeListName = Object.keys(lists)[0] || "Liste Par Défaut";
    let html5QrcodeScanner = null;

    window.onload = () => {
      loadSettings();
      updateListSelect();
      renderActiveList();
      syncStockFromGitHub();
    };

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.getElementById(`tab-${tabId}`).classList.add('active');

      ['search', 'lists', 'settings'].forEach(t => {
        const btn = document.getElementById(`nav-${t}`);
        if (t === tabId) {
          btn.className = "flex flex-col items-center text-brand-500 font-semibold text-xs space-y-1";
        } else {
          btn.className = "flex flex-col items-center text-gray-400 hover:text-gray-600 text-xs space-y-1";
        }
      });

      if (tabId !== 'search' && html5QrcodeScanner) stopScanner();
    }

    function searchArticle() {
      const query = document.getElementById('search-input').value.trim().toLowerCase();
      const container = document.getElementById('search-results');
      container.innerHTML = '';

      if (!query) return;

      const results = stockData.filter(item => item.code && item.code.toString().toLowerCase().includes(query));

      if (results.length === 0) {
        container.innerHTML = `<div class="bg-white p-4 rounded-xl border border-gray-100 text-center text-xs text-gray-400">Aucun article trouvé.</div>`;
        return;
      }

      results.forEach(item => {
        const card = document.createElement('div');
        card.className = "bg-white p-4 rounded-xl border border-gray-100 shadow-sm space-y-3";
        card.innerHTML = `
          <div class="flex justify-between items-start">
            <div>
              <span class="inline-block px-2 py-0.5 bg-gray-100 text-gray-600 rounded text-[10px] font-semibold uppercase tracking-wider mb-1">Code</span>
              <h3 class="text-base font-bold text-gray-900">${item.code}</h3>
            </div>
            <button onclick="addToList('${item.code}')" class="bg-brand-500 hover:bg-brand-600 text-white font-medium text-xs px-3 py-1.5 rounded-lg transition">
              + Ajouter
            </button>
          </div>
          <div class="grid grid-cols-2 gap-2 pt-2 border-t border-gray-50 text-xs">
            <div>
              <span class="text-gray-400 block text-[10px]">Prix de vente</span>
              <span class="font-semibold text-gray-800">${item.prix_de_vente || '0'} €</span>
            </div>
            <div>
              <span class="text-gray-400 block text-[10px]">Stock</span>
              <span class="font-semibold text-gray-800">${item.stock || '0'}</span>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function toggleScanner() {
      const readerEl = document.getElementById('reader');
      const btnText = document.getElementById('scan-btn-text');

      if (readerEl.classList.contains('hidden')) {
        readerEl.classList.remove('hidden');
        btnText.textContent = "Arrêter le scanner";
        html5QrcodeScanner = new Html5Qrcode("reader");
        html5QrcodeScanner.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 220, height: 140 } },
          (decodedText) => {
            document.getElementById('search-input').value = decodedText;
            searchArticle();
            stopScanner();
          },
          (err) => {}
        );
      } else {
        stopScanner();
      }
    }

    function stopScanner() {
      if (html5QrcodeScanner) {
        html5QrcodeScanner.stop().then(() => {
          document.getElementById('reader').classList.add('hidden');
          document.getElementById('scan-btn-text').textContent = "Scanner un code";
          html5QrcodeScanner = null;
        });
      }
    }

    function addToList(codeArticle) {
      const item = stockData.find(i => i.code.toString() === codeArticle.toString());
      if (!item) return;

      if (!lists[activeListName]) lists[activeListName] = [];
      lists[activeListName].push(item);
      saveListsToStorage();
      renderActiveList();
      alert(`Article "${item.code}" ajouté à "${activeListName}" !`);
    }

    function createNewList() {
      const name = document.getElementById('new-list-name').value.trim();
      if (!name) return;
      if (!lists[name]) lists[name] = [];
      activeListName = name;
      document.getElementById('new-list-name').value = '';
      saveListsToStorage();
      updateListSelect();
      renderActiveList();
    }

    function switchActiveList() {
      activeListName = document.getElementById('active-list-select').value;
      renderActiveList();
    }

    function renderActiveList() {
      const container = document.getElementById('active-list-items');
      container.innerHTML = '';
      const items = lists[activeListName] || [];

      if (items.length === 0) {
        container.innerHTML = `<p class="text-gray-400 text-xs italic py-3 text-center">Aucun article dans cette liste.</p>`;
        return;
      }

      items.forEach((item, index) => {
        const row = document.createElement('div');
        row.className = "py-2.5 flex justify-between items-center";
        row.innerHTML = `
          <div>
            <p class="font-bold text-xs text-gray-900">Code : ${item.code}</p>
            <p class="text-[11px] text-gray-500">Prix : ${item.prix_de_vente} € | Stock : ${item.stock}</p>
          </div>
          <button onclick="removeFromList(${index})" class="text-red-500 hover:text-red-700 font-bold text-sm px-2">✕</button>
        `;
        container.appendChild(row);
      });
    }

    function removeFromList(index) {
      lists[activeListName].splice(index, 1);
      saveListsToStorage();
      renderActiveList();
    }

    function saveListsToStorage() {
      localStorage.setItem('app_lists', JSON.stringify(lists));
    }

    function updateListSelect() {
      const select = document.getElementById('active-list-select');
      select.innerHTML = '';
      Object.keys(lists).forEach(name => {
        const option = document.createElement('option');
        option.value = name;
        option.textContent = name;
        if (name === activeListName) option.selected = true;
        select.appendChild(option);
      });
    }

    function exportExcel5() {
      const items = lists[activeListName] || [];
      const storeName = localStorage.getItem('cfg_store_name') || 'Magasin';

      const data = items.map(i => ({
        Magasin: storeName,
        Code: i.code,
        PrixDeVente: i.prix_de_vente,
        Stock: i.stock
      }));

      const worksheet = XLSX.utils.json_to_sheet(data);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "Balisage");

      const buffer = XLSX.write(workbook, { bookType: 'biff5', type: 'array' });
      const blob = new Blob([buffer], { type: "application/vnd.ms-excel" });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `${activeListName}_Excel95.xls`;
      link.click();
    }

    function sendByEmail() {
      const email = localStorage.getItem('cfg_target_email');
      const store = localStorage.getItem('cfg_store_name') || 'Magasin';
      if (!email) {
        alert("Veuillez configurer l'e-mail dans l'onglet Paramètres.");
        switchTab('settings');
        return;
      }

      const subject = encodeURIComponent(`[Balisage] ${store} - ${activeListName}`);
      const body = encodeURIComponent(`Bonjour,\n\nVoici la liste de balisage "${activeListName}" pour le magasin ${store}.\n\nMerci de joindre le fichier Excel 5.0/95 téléchargé.\n\nCordialement.`);
      window.location.href = `mailto:${email}?subject=${subject}&body=${body}`;
    }

    async function saveToGitHub() {
      const token = localStorage.getItem('cfg_github_token');
      const repo = localStorage.getItem('cfg_github_repo');

      if (!token || !repo) {
        alert("Veuillez configurer GitHub dans les Paramètres.");
        switchTab('settings');
        return;
      }

      const items = lists[activeListName] || [];
      const content = btoa(JSON.stringify(items, null, 2));
      const fileName = `exports/${activeListName.replace(/[^a-z0-9]/gi, '_')}.json`;
      const url = `https://api.github.com/repos/${repo}/contents/${fileName}`;

      try {
        let sha = "";
        const getRes = await fetch(url, { headers: { Authorization: `token ${token}` } });
        if (getRes.ok) {
          const fileData = await getRes.json();
          sha = fileData.sha;
        }

        const putRes = await fetch(url, {
          method: 'PUT',
          headers: { Authorization: `token ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: `Backup balisage: ${activeListName}`, content: content, sha: sha || undefined })
        });

        if (putRes.ok) alert("Sauvegardé sur GitHub !");
        else alert("Erreur lors de la sauvegarde.");
      } catch (err) {
        alert("Erreur de connexion avec GitHub.");
      }
    }

    function saveSettings() {
      localStorage.setItem('cfg_store_name', document.getElementById('setting-store-name').value);
      localStorage.setItem('cfg_target_email', document.getElementById('setting-target-email').value);
      localStorage.setItem('cfg_stock_url', document.getElementById('setting-stock-url').value);
      localStorage.setItem('cfg_github_token', document.getElementById('setting-github-token').value);
      localStorage.setItem('cfg_github_repo', document.getElementById('setting-github-repo').value);

      loadSettings();
      alert("Paramètres enregistrés !");
      syncStockFromGitHub();
    }

    function loadSettings() {
      const storeName = localStorage.getItem('cfg_store_name') || '';
      document.getElementById('setting-store-name').value = storeName;
      document.getElementById('header-store-name').textContent = storeName || 'Magasin non configuré';

      document.getElementById('setting-target-email').value = localStorage.getItem('cfg_target_email') || '';
      document.getElementById('setting-stock-url').value = localStorage.getItem('cfg_stock_url') || '';
      document.getElementById('setting-github-token').value = localStorage.getItem('cfg_github_token') || '';
      document.getElementById('setting-github-repo').value = localStorage.getItem('cfg_github_repo') || '';
    }

    async function syncStockFromGitHub() {
      const stockUrl = localStorage.getItem('cfg_stock_url');
      const statusEl = document.getElementById('sync-status');
      const badgeText = document.getElementById('sync-badge-text');

      if (!stockUrl) {
        statusEl.textContent = "URL CSV non configurée.";
        badgeText.textContent = "Attente CSV";
        return;
      }

      statusEl.textContent = "Chargement du fichier CSV...";

      try {
        const response = await fetch(`${stockUrl}?t=${Date.now()}`);
        if (!response.ok) throw new Error("CSV introuvable.");

        const csvText = await response.text();

        Papa.parse(csvText, {
          header: true,
          skipEmptyLines: true,
          transformHeader: h => h.trim().toLowerCase().replace(/\s+/g, '_'),
          complete: function(results) {
            stockData = results.data;
            const now = new Date().toLocaleTimeString();
            statusEl.textContent = `Dernière synchro : ${now} (${stockData.length} articles)`;
            badgeText.textContent = "Prêt";
          }
        });
      } catch (err) {
        console.error(err);
        statusEl.textContent = "Erreur de synchro CSV.";
        badgeText.textContent = "Erreur";
      }
    }
  </script>
</body>
</html>
