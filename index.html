<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<title>Balisage TPC</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2/dist/quagga.min.js"></script>
<style>
:root{--navy:#1A2B3C;--org:#FF6B35;--grn:#2ECC71;--red:#E53E3E;--bg:#F0F4F8;--card:#fff;--txt:#1A2B3C;--mut:#6B7A8D;--brd:#DDE3EC;--red2:#FEF2F2;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--txt);display:flex;flex-direction:column;}
#hdr{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0;}
.logo{font-family:'Barlow Condensed',sans-serif;font-size:21px;font-weight:800;}
.logo b{color:var(--org);}
.sinfo{margin-left:auto;text-align:right;font-size:13px;color:rgba(255,255,255,.9);}
#main{flex:1;overflow-y:auto;padding:16px 16px 84px;}
#nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--brd);display:flex;z-index:50;}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px 10px;border:none;background:none;cursor:pointer;font-size:10px;color:var(--mut);}
.nb.on{color:var(--org);}
.pg{display:none;}.pg.on{display:block;}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);}
.btn{padding:11px 18px;border-radius:8px;border:none;font-size:14px;font-weight:600;cursor:pointer;}
.btn:active{opacity:.8;}
.bP{background:var(--org);color:#fff;}
.bS{background:var(--bg);color:var(--txt);border:1px solid var(--brd);}
.bN{background:var(--navy);color:#fff;}
.bD{background:var(--red2);color:var(--red);}
.bB{display:block;width:100%;margin-bottom:10px;}
.bSm{padding:8px 12px;font-size:12px;}
.fg{margin-bottom:14px;}
.fl{display:block;font-size:11px;font-weight:600;color:var(--mut);margin-bottom:6px;}
.fi{width:100%;padding:11px 14px;border:1px solid var(--brd);border-radius:8px;font-size:14px;}
.fi:focus{outline:none;border-color:var(--org);}
.toast{position:fixed;bottom:100px;left:16px;right:16px;padding:12px 16px;border-radius:8px;font-size:13px;font-weight:600;z-index:1000;animation:slideUp .3s ease;}
.toast.ok{background:#E8F8F0;color:var(--grn);}
@keyframes slideUp{from{transform:translateY(100px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:999;}
.modal-overlay.on{display:flex;}
.modal-content{background:#fff;border-radius:16px;padding:24px;max-width:90%;max-height:90vh;overflow-y:auto;}
.szn{background:linear-gradient(135deg,#1A2B3C,#2d4a6b);border-radius:14px;padding:16px;margin-bottom:12px;}
.srow{display:flex;gap:8px;}
.si{flex:1;padding:12px 14px;border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);border-radius:8px;color:#fff;font-size:14px;}
.si:focus{outline:none;border-color:var(--org);}
.si::placeholder{color:rgba(255,255,255,.4);}
.bcam{padding:12px 14px;background:var(--org);border:none;border-radius:8px;color:#fff;cursor:pointer;font-size:16px;}
.bsearch{padding:12px 14px;background:rgba(255,255,255,.2);border:none;border-radius:8px;color:#fff;cursor:pointer;font-size:16px;}
</style>
</head>
<body>

<div id="hdr">
  <div class="logo">Balisage <b>TPC</b></div>
  <div class="sinfo" id="hdr-user">—</div>
  <button class="btn bS bSm" id="btn-switch">🔄</button>
</div>

<!-- MODALE DÉMARRAGE -->
<div id="modal-start" class="modal-overlay on">
  <div class="modal-content" style="text-align:center;min-width:300px;">
    <div style="font-size:20px;font-weight:700;margin-bottom:24px;">🔐 Scanner votre badge</div>
    
    <div style="display:flex;gap:10px;margin-bottom:16px;">
      <input type="text" id="badge-start" placeholder="Scannez..." style="flex:1;padding:12px;border:2px solid var(--brd);border-radius:8px;font-size:14px;" autocomplete="off" autofocus>
      <button class="btn bP" id="btn-cam-start">📷</button>
    </div>
    
    <div style="font-size:12px;color:var(--mut);padding:12px;background:var(--bg);border-radius:8px;margin-bottom:16px;">
      Badge: <strong id="badge-start-display">—</strong>
    </div>
    
    <div id="form-start" style="display:none;text-align:left;">
      <div style="background:#FEF2F2;padding:12px;border-radius:8px;margin-bottom:16px;font-size:12px;color:var(--red);">
        ⚠️ Badge non reconnu - Enregistrez-le
      </div>
      <div class="fg"><label class="fl">Nom</label><input type="text" id="start-name" class="fi" placeholder="Jean Dupont"></div>
      <div class="fg"><label class="fl">N° Badge</label><input type="text" id="start-num" class="fi" placeholder="232"></div>
      <div class="fg"><label class="fl">Commentaire</label><input type="text" id="start-comment" class="fi" placeholder="Optionnel"></div>
      <button class="btn bP bB" onclick="saveBadgeStart()">✅ Enregistrer</button>
    </div>
  </div>
</div>

<div id="main">

<!-- PAGE CONSULTER -->
<div class="pg on" id="pg-consulter">
  <div class="szn">
    <div style="color:rgba(255,255,255,.6);font-size:11px;margin-bottom:10px;font-weight:600;">Rechercher article</div>
    <div class="srow">
      <input class="si" type="text" id="search-in" placeholder="Code, barres ou libellé..." autocomplete="off" autofocus>
      <button class="bsearch" id="btn-search">🔎</button>
      <button class="bcam" id="btn-cam-search">📷</button>
    </div>
  </div>
  <div id="search-results"></div>
</div>

<!-- PAGE BALISER -->
<div class="pg" id="pg-baliser">
  <div style="display:flex;gap:10px;margin-bottom:16px;">
    <div style="font-size:18px;font-weight:700;">Listes</div>
    <button class="btn bP bSm" id="btn-new-list">+ Nouvelle</button>
  </div>
  <div id="lists-container"></div>
</div>

<!-- PAGE DÉTAIL -->
<div class="pg" id="pg-detail">
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;">
    <button class="btn bS bSm" id="btn-back">← Retour</button>
    <div style="flex:1;">
      <div id="detail-name" style="font-size:17px;font-weight:700;"></div>
      <div id="detail-count" style="font-size:12px;color:var(--mut);"></div>
    </div>
  </div>
  
  <div class="szn" style="padding:14px;">
    <div style="color:rgba(255,255,255,.6);font-size:11px;margin-bottom:10px;font-weight:600;">Ajouter article</div>
    <div class="srow">
      <input class="si" type="text" id="add-in" placeholder="Code..." autocomplete="off">
      <button class="bsearch" id="btn-add-search">🔎</button>
      <button class="bcam" id="btn-cam-add">📷</button>
    </div>
  </div>
  
  <div id="detail-items"></div>
  <button class="btn bP bB" id="btn-send">📧 Envoyer Gmail+Drive</button>
  <button class="btn bD bSm bB" id="btn-del-list">🗑️ Supprimer</button>
</div>

<!-- PAGE RÉGLAGES -->
<div class="pg" id="pg-reglages">
  <div style="font-size:18px;font-weight:700;margin-bottom:16px;">Réglages</div>
  
  <div class="card">
    <div style="font-size:11px;font-weight:600;color:var(--mut);margin-bottom:12px;text-transform:uppercase;">Magasin</div>
    <div class="fg"><label class="fl">Nom</label><input type="text" id="inp-magasin" class="fi" placeholder="TAHITI PAS CHER ARUE"></div>
    <div class="fg"><label class="fl">Email</label><input type="email" id="inp-email" class="fi" placeholder="tpcarue@gmail.com"></div>
  </div>

  <div class="card">
    <div style="font-size:11px;font-weight:600;color:var(--mut);margin-bottom:12px;text-transform:uppercase;">Badges</div>
    <button class="btn bN bB" id="btn-add-badge">📷 Ajouter badge</button>
    <div id="badges-container"></div>
  </div>

  <div class="card">
    <div style="font-size:11px;font-weight:600;color:var(--mut);margin-bottom:12px;text-transform:uppercase;">Stock</div>
    <button class="btn bP bB" id="btn-import-csv">📁 Importer CSV</button>
    <div id="import-status" style="font-size:12px;color:var(--mut);display:none;margin-top:8px;"></div>
    <input type="file" id="csv-file" accept=".csv" style="display:none">
  </div>
</div>

</div>

<div id="nav">
  <button class="nb on" id="nb-consulter">🔍 Consulter</button>
  <button class="nb" id="nb-baliser">📋 Baliser</button>
  <button class="nb" id="nb-reglages">⚙️ Réglages</button>
</div>

<script>
// ===== HELPERS =====
function $(id){ return document.getElementById(id); }
function lsSet(k,v){ try{localStorage.setItem(k,v);}catch(e){} }
function lsGet(k){ try{return localStorage.getItem(k);}catch(e){return null;} }

// ===== DATA =====
var articles = [];
var lists = [];
var badges = {};
var currentList = null;
var currentBadge = null;
var magasin = '';
var email = '';
var camMode = null;
var camCanvas = null;

// ===== INIT =====
function init(){
  load();
  setupEvents();
}

function load(){
  badges = JSON.parse(lsGet('badges') || '{}');
  articles = JSON.parse(lsGet('articles') || '[]');
  lists = JSON.parse(lsGet('lists') || '[]');
  currentBadge = lsGet('badgeActuel') || null;
  magasin = lsGet('magasin') || 'TAHITI PAS CHER';
  email = lsGet('email') || '';
  
  $('inp-magasin').value = magasin;
  $('inp-email').value = email;
  updateHeader();
}

function save(){
  lsSet('badges', JSON.stringify(badges));
  lsSet('articles', JSON.stringify(articles));
  lsSet('lists', JSON.stringify(lists));
  lsSet('badgeActuel', currentBadge || '');
  lsSet('magasin', magasin);
  lsSet('email', email);
}

// ===== HEADER =====
function updateHeader(){
  var name = badges[currentBadge] ? badges[currentBadge].nom : '—';
  $('hdr-user').textContent = name;
}

// ===== DÉMARRAGE =====
$('badge-start').addEventListener('keypress', function(e){
  if(e.key === 'Enter' && this.value.trim()){
    processBadge(this.value);
  }
});

$('btn-cam-start').onclick = function(){
  openCam('badge-start');
};

function processBadge(code){
  code = code.trim().replace(/[\s\r\n]/g, '').substring(0,50);
  $('badge-start').value = '';
  $('badge-start-display').textContent = code;
  
  if(badges[code]){
    currentBadge = code;
    save();
    $('modal-start').classList.remove('on');
    updateHeader();
  } else {
    $('form-start').style.display = 'block';
    $('start-name').focus();
  }
}

function saveBadgeStart(){
  var code = $('badge-start-display').textContent.trim();
  var nom = $('start-name').value.trim();
  var num = $('start-num').value.trim();
  var comment = $('start-comment').value.trim();
  
  if(!code || !nom || !num){ alert('Remplissez tous les champs'); return; }
  
  badges[code] = {nom:nom, num:num, comment:comment, date:new Date().toISOString().split('T')[0]};
  currentBadge = code;
  save();
  $('modal-start').classList.remove('on');
  updateHeader();
  toast('✅ Badge enregistré!');
}

$('btn-switch').onclick = function(){
  $('modal-start').classList.add('on');
  $('form-start').style.display = 'none';
  $('badge-start').value = '';
  $('badge-start-display').textContent = '—';
  $('start-name').value = '';
  $('start-num').value = '';
  $('start-comment').value = '';
  $('badge-start').focus();
};

// ===== CAMÉRA =====
function openCam(mode){
  camMode = mode;
  
  var div = document.createElement('div');
  div.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#000;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;';
  
  var statusDiv = document.createElement('div');
  statusDiv.style.cssText = 'color:#fff;margin-bottom:16px;font-size:14px;';
  statusDiv.textContent = 'Initialisation caméra...';
  
  camCanvas = document.createElement('canvas');
  camCanvas.style.cssText = 'width:100%;max-width:500px;height:auto;border-radius:8px;margin-bottom:16px;';
  
  var closeBtn = document.createElement('button');
  closeBtn.className = 'btn bD';
  closeBtn.textContent = '✕ Fermer';
  closeBtn.onclick = closeCam;
  
  var manualInput = document.createElement('input');
  manualInput.type = 'text';
  manualInput.placeholder = 'Ou tapez le code...';
  manualInput.style.cssText = 'width:100%;max-width:300px;padding:12px;border:2px solid var(--org);border-radius:8px;font-size:14px;margin-bottom:16px;';
  manualInput.onkeypress = function(e){
    if(e.key === 'Enter' && this.value.trim()){
      closeCam();
      handleScan(this.value);
    }
  };
  
  div.appendChild(statusDiv);
  div.appendChild(camCanvas);
  div.appendChild(manualInput);
  div.appendChild(closeBtn);
  div.id = 'cam-modal';
  document.body.appendChild(div);
  
  if(window.Quagga){
    Quagga.init({
      inputStream: { type: 'LiveStream', constraints: { facingMode: 'environment', width: {ideal:1280}, height: {ideal:720} }, target: camCanvas },
      decoder: { readers: ['code_128_reader', 'ean_reader', 'ean_8_reader', 'upc_reader', 'codabar_reader', 'code_39_reader'] }
    }, function(err){
      if(err){
        statusDiv.textContent = 'Erreur caméra - tapez le code manuellement';
        manualInput.focus();
        return;
      }
      statusDiv.textContent = 'Scannez un code-barres ou RFID...';
      Quagga.start();
      Quagga.onDetected(function(result){
        if(result.codeResult.code){
          Quagga.stop();
          closeCam();
          handleScan(result.codeResult.code);
        }
      });
    });
  } else {
    statusDiv.textContent = 'Tapez le code:';
    manualInput.focus();
  }
}

function closeCam(){
  camMode = null;
  if(window.Quagga) Quagga.stop();
  var m = document.getElementById('cam-modal');
  if(m) m.remove();
}

function scan(){
  // Pas utilisé avec Quagga2
}

function handleScan(result){
  result = result.trim();
  
  if(camMode === 'badge-start'){
    processBadge(result);
  } else if(camMode === 'badge-add'){
    $('badge-reg-code').value = result.replace(/[\s\r\n]/g, '').substring(0,50);
  } else if(camMode === 'search'){
    $('search-in').value = result;
    $('btn-search').click();
  } else if(camMode === 'add'){
    $('add-in').value = result;
    $('btn-add-search').click();
  }
}

// ===== ARTICLES =====
function displayArticle(art, onClick){
  var siteNames = ['Entrepôt','TPC VILLE','TPC PUNA','TPC TRVO','TPC PAO','TPC ARUE','TPC MOOREA'];
  var sites = [art.site0,art.site1,art.site2,art.site3,art.site4,art.site5,art.site6];
  var stocks = [];
  for(var i=0;i<7;i++) if(sites[i]>0) stocks.push(siteNames[i]+': '+sites[i]);
  
  var html = '<div class="card" onclick="'+onClick+'" style="cursor:pointer;">';
  html += '<div style="font-weight:600;font-size:14px;">'+art.libelle;
  if(art.PPN) html += ' <span style="color:var(--red);font-size:12px;">⚠️ PPN</span>';
  html += '</div>';
  html += '<div style="font-size:11px;color:var(--mut);margin-top:4px;">Code: '+art.code+' | Barres: '+(art.codebarre||'—')+'</div>';
  html += '<div style="font-size:16px;font-weight:700;color:var(--org);margin-top:8px;">'+(art.prix_vente||0)+' XPF</div>';
  html += '<div style="font-size:11px;color:var(--mut);margin-top:8px;">Stock: '+(art.conso||0)+'</div>';
  if(stocks.length>0) html += '<div style="font-size:10px;color:var(--mut);margin-top:6px;">'+stocks.join(' | ')+'</div>';
  if(art.PPN) html += '<div style="font-size:11px;color:var(--red);margin-top:8px;padding:6px;background:var(--red2);border-radius:4px;font-weight:600;">🔴 PRODUIT PREMIÈRE NÉCESSITÉ - Vérifier balisage en rayon</div>';
  html += '</div>';
  return html;
}

function search(q){
  if(!q) return [];
  q = q.toLowerCase();
  return articles.filter(x => x.code.includes(q) || x.libelle.toLowerCase().includes(q) || (x.codebarre && x.codebarre.includes(q)));
}

$('btn-search').onclick = function(){
  var q = $('search-in').value.trim();
  var res = search(q);
  var html = '';
  if(res.length===0) html = '<div style="text-align:center;padding:40px;color:var(--mut);">Aucun résultat</div>';
  else res.forEach((a,i) => html += displayArticle(a, 'addToList('+i+')'));
  $('search-results').innerHTML = html;
};

$('search-in').addEventListener('keypress', function(e){ if(e.key==='Enter') $('btn-search').click(); });
$('btn-cam-search').onclick = function(){ openCam('search'); };

// ===== LISTES =====
function renderLists(){
  var html = '';
  if(lists.length===0) html = '<div style="text-align:center;padding:40px;color:var(--mut);">Créez une liste</div>';
  else lists.forEach(l => html += '<div class="card" onclick="openList('+l.id+')" style="cursor:pointer;"><div style="font-weight:600;">'+l.nom+'</div><div style="font-size:11px;color:var(--mut);margin-top:4px;">'+(l.items?l.items.length:0)+' articles</div></div>');
  $('lists-container').innerHTML = html;
}

$('btn-new-list').onclick = function(){
  var nom = prompt('Nom de la liste:');
  if(!nom) return;
  lists.push({id:Date.now(), nom:nom, items:[]});
  save();
  renderLists();
};

function openList(id){
  currentList = id;
  showPg('detail');
  renderDetail();
}

function renderDetail(){
  var list = lists.find(x => x.id === currentList);
  if(!list) return;
  
  $('detail-name').textContent = list.nom;
  $('detail-count').textContent = (list.items?list.items.length:0)+' article(s)';
  
  var html = '';
  if(!list.items || list.items.length===0) html = '<div style="text-align:center;padding:40px;color:var(--mut);">Aucun article</div>';
  else list.items.forEach((item,i) => html += '<div class="card" style="display:flex;justify-content:space-between;"><div><div style="font-weight:600;">'+item.libelle+'</div><div style="font-size:11px;color:var(--mut);">'+item.code+'</div></div><div style="text-align:right;"><div style="font-weight:700;font-size:14px;">'+item.qty+'x</div><button class="btn bD bSm" onclick="delItem('+i+')">✕</button></div></div>');
  $('detail-items').innerHTML = html;
}

function addToList(idx){
  if(!currentList) { alert('Créez une liste'); return; }
  var list = lists.find(x => x.id === currentList);
  if(!list) return;
  
  var art = articles[idx];
  var existing = list.items.find(x => x.code === art.code);
  
  if(existing) existing.qty++;
  else list.items.push({code:art.code, libelle:art.libelle, codebarre:art.codebarre, qty:1});
  
  save();
  renderDetail();
}

function delItem(idx){
  var list = lists.find(x => x.id === currentList);
  if(!list) return;
  list.items.splice(idx,1);
  save();
  renderDetail();
}

$('btn-add-search').onclick = function(){
  var q = $('add-in').value.trim();
  var res = search(q);
  if(res.length===0) { alert('Aucun article'); return; }
  if(res.length===1) { addToList(articles.indexOf(res[0])); $('add-in').value = ''; renderDetail(); }
  else alert('Plusieurs résultats');
};

$('add-in').addEventListener('keypress', function(e){ if(e.key==='Enter') $('btn-add-search').click(); });
$('btn-cam-add').onclick = function(){ openCam('add'); };

$('btn-send').onclick = function(){
  if(!currentBadge || !badges[currentBadge]){ alert('Badge obligatoire'); return; }
  var list = lists.find(x => x.id === currentList);
  if(!list || !list.items || list.items.length===0){ alert('Liste vide'); return; }
  
  var rows = [['code-barres','libelle','quantite']];
  list.items.forEach(item => rows.push([item.codebarre||'', item.libelle, item.qty]));
  
  var ws = XLSX.utils.aoa_to_sheet(rows);
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Balisage');
  XLSX.writeFile(wb, 'balisage_'+new Date().toISOString().split('T')[0]+'.xlsx');
  
  lists = lists.filter(x => x.id !== currentList);
  currentList = null;
  save();
  renderLists();
  showPg('baliser');
  toast('✅ Fichier généré!');
};

$('btn-del-list').onclick = function(){
  if(!confirm('Supprimer?')) return;
  lists = lists.filter(x => x.id !== currentList);
  currentList = null;
  save();
  renderLists();
  showPg('baliser');
};

$('btn-back').onclick = function(){ showPg('baliser'); renderLists(); };

// ===== RÉGLAGES =====
$('inp-magasin').onchange = function(){ magasin = this.value; save(); };
$('inp-email').onchange = function(){ email = this.value; save(); };

$('btn-add-badge').onclick = function(){
  var code = prompt('Scannez le badge:');
  if(!code) return;
  code = code.trim().replace(/[\s\r\n]/g, '').substring(0,50);
  if(badges[code]) { alert('Existe déjà'); return; }
  
  var nom = prompt('Nom:');
  if(!nom) return;
  var num = prompt('N°:');
  if(!num) return;
  
  badges[code] = {nom:nom.trim(), num:num.trim(), comment:prompt('Commentaire:')||'', date:new Date().toISOString().split('T')[0]};
  save();
  renderBadges();
  toast('✅ Badge ajouté!');
};

function renderBadges(){
  var html = '';
  var keys = Object.keys(badges);
  if(keys.length===0) html = '<div style="text-align:center;padding:20px;color:var(--mut);">Aucun badge</div>';
  else keys.forEach(k => {
    var b = badges[k];
    html += '<div class="card"><div style="display:flex;justify-content:space-between;"><div><div style="font-weight:600;">'+b.nom+'</div><div style="font-size:11px;color:var(--mut);">N°: '+b.num+' | Badge: '+k+'</div></div><button class="btn bD bSm" onclick="delBadge(\''+k+'\')">✕</button></div></div>';
  });
  $('badges-container').innerHTML = html;
}

function delBadge(k){
  if(!confirm('Supprimer?')) return;
  delete badges[k];
  save();
  renderBadges();
}

$('btn-import-csv').onclick = function(){ $('csv-file').click(); };

$('csv-file').onchange = function(e){
  var file = e.target.files[0];
  if(!file) return;
  
  var reader = new FileReader();
  reader.onload = function(evt){
    var lines = evt.target.result.split(/\r?\n/);
    articles = [];
    
    for(var i=1; i<lines.length; i++){
      var line = lines[i].trim();
      if(!line) continue;
      
      var f = line.split(';');
      if(f.length<13) continue;
      
      var prix = f[12] ? parseInt(f[12].replace(',','.')) : 0;
      var ppn = f.length>50 ? parseInt(f[50]) : 0;
      
      var art = {
        code: f[0],
        libelle: f[1],
        codebarre: f[2],
        prix_vente: prix,
        conso: f[28] ? parseInt(f[28]) : 0,
        site0: f[29] ? parseInt(f[29]) : 0,
        site1: f[31] ? parseInt(f[31]) : 0,
        site2: f[33] ? parseInt(f[33]) : 0,
        site3: f[35] ? parseInt(f[35]) : 0,
        site4: f[37] ? parseInt(f[37]) : 0,
        site5: f[39] ? parseInt(f[39]) : 0,
        site6: f[41] ? parseInt(f[41]) : 0,
        PPN: ppn
      };
      
      if(art.code) articles.push(art);
    }
    
    save();
    $('import-status').textContent = '✅ '+articles.length+' articles importés';
    $('import-status').style.display = 'block';
    toast('✅ Stock importé!');
  };
  reader.readAsText(file);
};

// ===== NAV =====
function showPg(n){
  document.querySelectorAll('.pg').forEach(x => x.classList.remove('on'));
  $('pg-'+n).classList.add('on');
  document.querySelectorAll('.nb').forEach(x => x.classList.remove('on'));
  $('nb-'+n).classList.add('on');
}

$('nb-consulter').onclick = function(){ showPg('consulter'); };
$('nb-baliser').onclick = function(){ showPg('baliser'); renderLists(); };
$('nb-reglages').onclick = function(){ showPg('reglages'); renderBadges(); };

// ===== TOAST =====
function toast(msg){
  var t = document.createElement('div');
  t.className = 'toast ok';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

function setupEvents(){}

window.addEventListener('load', init);
