<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Balisage TPC">
<meta name="theme-color" content="#1A2B3C">
<title>Balisage TPC</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async></script>
<style>
:root{--navy:#1A2B3C;--org:#FF6B35;--org2:#FFF0EB;--grn:#2ECC71;--grn2:#E8F8F0;--bg:#F0F4F8;--card:#fff;--txt:#1A2B3C;--mut:#6B7A8D;--brd:#DDE3EC;--red:#E53E3E;--red2:#FEF2F2;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--txt);display:flex;flex-direction:column;}
#hdr{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.2);}
#hdr img.hlogo{height:32px;object-fit:contain;}
.logo{font-family:'Barlow Condensed',sans-serif;font-size:21px;font-weight:800;color:#fff;}
.logo b{color:var(--org);}
.sinfo{margin-left:auto;text-align:right;font-size:11px;color:rgba(255,255,255,.6);line-height:1.4;}
.sinfo strong{display:block;color:rgba(255,255,255,.9);font-size:13px;}
#main{flex:1;overflow-y:auto;padding:16px 16px 84px;}
#nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--brd);display:flex;z-index:50;}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px 10px;border:none;background:none;cursor:pointer;font-size:10px;font-weight:500;color:var(--mut);position:relative;}
.nb svg{margin-bottom:3px;}
.nb.on{color:var(--org);}
.nb.on::after{content:'';position:absolute;top:0;left:20%;right:20%;height:3px;background:var(--org);border-radius:0 0 3px 3px;}
.bdg{position:absolute;top:4px;right:calc(50% - 18px);background:var(--org);color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:10px;}
.pg{display:none;}.pg.on{display:block;}
.card{background:var(--card);border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,.08);padding:16px;margin-bottom:12px;}
.ctit{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--mut);margin-bottom:12px;}
.szn{background:linear-gradient(135deg,#1A2B3C,#2d4a6b);border-radius:14px;padding:16px;margin-bottom:12px;}
.slbl{color:rgba(255,255,255,.6);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px;}
.srow{display:flex;gap:8px;}
.si{flex:1;padding:12px 14px;border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);border-radius:8px;color:#fff;font-size:16px;outline:none;}
.si::placeholder{color:rgba(255,255,255,.4);}
.si:focus{border-color:var(--org);}
.bcam{padding:12px 14px;background:var(--org);border:none;border-radius:8px;color:#fff;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;flex-shrink:0;}
.bsearch{padding:12px 14px;background:rgba(255,255,255,.2);border:none;border-radius:8px;color:#fff;cursor:pointer;font-size:16px;flex-shrink:0;}
.btn{padding:11px 18px;border-radius:8px;border:none;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;}
.btn:active{opacity:.8;}
.bP{background:var(--org);color:#fff;}
.bS{background:var(--bg);color:var(--txt);border:1px solid var(--brd);}
.bN{background:var(--navy);color:#fff;}
.bG{background:#1a73e8;color:#fff;}
.bD{background:var(--red2);color:var(--red);}
.bB{width:100%;}
.bSm{padding:8px 12px;font-size:13px;border-radius:6px;}
.fg{margin-bottom:14px;}
.fl{font-size:12px;font-weight:600;color:var(--mut);margin-bottom:6px;display:block;text-transform:uppercase;letter-spacing:.5px;}
.fi{width:100%;padding:11px 14px;border:1.5px solid var(--brd);border-radius:8px;font-size:15px;background:#fff;color:var(--txt);outline:none;font-family:'Inter',sans-serif;}
.fi:focus{border-color:var(--org);}
.ares{background:#fff;border-radius:14px;box-shadow:0 4px 20px rgba(0,0,0,.12);overflow:hidden;margin-bottom:12px;}
.ahdr{background:var(--navy);padding:12px 16px;}
.alib{color:#fff;font-size:16px;font-weight:600;line-height:1.3;margin-top:2px;}
.acode{font-size:11px;color:rgba(255,255,255,.5);}
.abody{padding:16px;}
.pmain{font-family:'Barlow Condensed',sans-serif;font-size:48px;font-weight:800;color:var(--org);line-height:1;}
.ameta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;}
.mi{background:var(--bg);border-radius:8px;padding:10px 12px;}
.ml{font-size:10px;font-weight:600;text-transform:uppercase;color:var(--mut);}
.mv{font-size:14px;font-weight:600;margin-top:2px;}
.sok{color:var(--grn);}.slow{color:var(--org);}.szero{color:var(--red);}
.aact{padding:0 16px 16px;}
.badd{width:100%;padding:12px;background:var(--org);border:none;border-radius:8px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;}
.li{background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:10px;box-shadow:0 2px 10px rgba(0,0,0,.07);display:flex;align-items:center;gap:12px;cursor:pointer;}
.lic{width:44px;height:44px;border-radius:10px;background:var(--org2);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:22px;}
.lin{flex:1;min-width:0;}
.lnm{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lmt{font-size:12px;color:var(--mut);margin-top:2px;}
.lcn{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:800;color:var(--org);}
.dar{background:#fff;border-radius:8px;padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;gap:10px;box-shadow:0 1px 6px rgba(0,0,0,.06);}
.dai{flex:1;min-width:0;}
.dal{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dam{font-size:11px;color:var(--mut);margin-top:2px;}
.qty-wrap{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.qty-btn{width:30px;height:30px;border-radius:6px;border:1.5px solid var(--brd);background:#fff;font-size:18px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--navy);}
.qty-val{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800;color:var(--org);min-width:32px;text-align:center;}
.bra{background:none;border:none;cursor:pointer;padding:6px;color:var(--mut);font-size:18px;flex-shrink:0;}
.mov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:flex-end;justify-content:center;}
.mov.on{display:flex;}
.mod{background:#fff;border-radius:14px 14px 0 0;padding:20px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;}
.mhdl{width:40px;height:4px;background:var(--brd);border-radius:2px;margin:0 auto 16px;}
.mtit{font-size:18px;font-weight:700;margin-bottom:16px;}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
.chip{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;border:1.5px solid var(--brd);background:#fff;cursor:pointer;color:var(--mut);}
.chip.on{border-color:var(--org);background:var(--org2);color:var(--org);}
#cam{display:none;position:fixed;inset:0;background:#000;z-index:400;flex-direction:column;}
#cam.on{display:flex;}
#camv{width:100%;flex:1;object-fit:cover;}
.cctrl{background:var(--navy);padding:16px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;}
.ccls{background:rgba(255,255,255,.2);border:none;color:#fff;padding:10px 20px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;}
.sr{display:flex;align-items:center;padding:14px 0;border-bottom:1px solid var(--brd);gap:12px;}
.sr:last-child{border-bottom:none;}
.si2{width:36px;height:36px;border-radius:8px;background:var(--org2);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px;}
.slb{font-size:14px;font-weight:600;}
.sds{font-size:12px;color:var(--mut);margin-top:2px;}
#toast{position:fixed;bottom:74px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--navy);color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:500;opacity:0;transition:all .25s;z-index:500;pointer-events:none;white-space:nowrap;max-width:90vw;text-align:center;}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
#toast.ok{background:var(--grn);}
#toast.er{background:var(--red);}
.emp{text-align:center;padding:36px 20px;color:var(--mut);}
.emp p{font-size:14px;line-height:1.6;margin-top:12px;}
.results-list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;}
.result-item{background:#fff;border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 6px rgba(0,0,0,.08);cursor:pointer;transition:box-shadow .15s;}
.result-item:active{box-shadow:0 2px 12px rgba(0,0,0,.15);}
.result-lib{font-size:14px;font-weight:600;color:var(--txt);line-height:1.3;}
.result-meta{font-size:11px;color:var(--mut);margin-top:3px;}
.result-price{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:800;color:var(--org);flex-shrink:0;}
.result-count{font-size:12px;color:var(--mut);padding:8px 0 4px;font-weight:600;}
.result-add{background:var(--grn);color:#fff;border:none;border-radius:6px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;flex-shrink:0;}
#send-overlay{display:none;position:fixed;inset:0;background:rgba(26,43,60,.88);z-index:600;flex-direction:column;align-items:center;justify-content:center;gap:16px;}
#send-overlay.on{display:flex;}
.spinner{width:48px;height:48px;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.send-msg{color:#fff;font-size:16px;font-weight:600;text-align:center;padding:0 20px;}
.badge-item{background:#fff;border-radius:10px;padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 6px rgba(0,0,0,.08);display:flex;align-items:center;justify-content:space-between;}
.badge-info{flex:1;}
.badge-nom{font-weight:600;font-size:14px;}
.badge-meta{font-size:12px;color:var(--mut);margin-top:4px;}
.btn-delete{background:var(--red2);color:var(--red);border:none;padding:6px 12px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;}
</style>
</head>
<body>

<div id="hdr">
  <div class="logo">Balisage<b>TPC</b></div>
  <div class="sinfo">
    <strong id="hdr-user" style="display:none;">—</strong>
    <div id="hdr-badge" style="display:none;font-size:10px;">—</div>
  </div>
</div>

<div id="main">
  <div id="pg-baliser" class="pg on">
    <div class="szn">
      <div class="slbl">Saisir un code</div>
      <div class="srow">
        <input id="scan-in" class="si" type="text" placeholder="Code..." autocomplete="off">
        <button id="btn-cam1" class="bcam">📷</button>
      </div>
    </div>
    <div id="art-zone"></div>
  </div>

  <div id="pg-reglages" class="pg">
    <div class="card" style="border-left:4px solid var(--org);background:var(--org2);">
      <strong style="color:var(--org);">⚙️ Réglages</strong>
    </div>

    <!-- Section Magasin -->
    <div class="card">
      <div class="ctit">Magasin</div>
      <div class="fg">
        <label class="fl">Nom du magasin</label>
        <input id="shop-name" class="fi" type="text" placeholder="Ex: TPC Arue">
      </div>
      <div class="fg">
        <label class="fl">Email</label>
        <input id="shop-email" class="fi" type="email" placeholder="contact@magasin.com">
      </div>
      <button class="btn bP bB" onclick="saveShopInfo()">Enregistrer magasin</button>
    </div>

    <!-- Section Google Drive -->
    <div class="card">
      <div class="ctit">Google Drive</div>
      <button id="btn-google-login" class="btn bG bB" onclick="startGoogleLogin()">Connecter Google</button>
      <div id="google-status" style="margin-top:10px;font-size:12px;color:var(--mut);display:none;">✓ Connecté</div>
    </div>

    <!-- Section Ajouter Badge -->
    <div class="card">
      <div class="ctit">Ajouter un employé</div>
      <div class="fg">
        <label class="fl">Nom de l'employé</label>
        <input id="badge-nom" class="fi" type="text" placeholder="Ex: Jean Dupont">
      </div>
      <div class="fg">
        <label class="fl">Numéro de badge/Matricule</label>
        <input id="badge-matricule" class="fi" type="text" placeholder="Ex: 232">
      </div>
      <div class="fg">
        <label class="fl">Scannez le badge RFID</label>
        <button class="btn bN bB" onclick="openCam('badge')">📱 Scanner le badge</button>
      </div>
      <input id="badge-scan-code" type="hidden">
      <button class="btn bP bB" onclick="saveBadgeScanned()">Enregistrer employé</button>
    </div>

    <!-- Liste des Badges Enregistrés -->
    <div class="card">
      <div class="ctit">Employés enregistrés</div>
      <div id="badges-list"></div>
    </div>

    <!-- Importer Stock -->
    <div class="card">
      <div class="ctit">Importer Stock</div>
      <input id="imp-file" type="file" accept=".xlsx,.xls,.csv" style="display:none;">
      <button class="btn bN bB" onclick="$('imp-file').click()">Choisir fichier CSV/XLSX</button>
      <div id="imp-st" style="margin-top:10px;font-size:12px;display:none;"></div>
    </div>
  </div>
</div>

<div id="nav">
  <button class="nb on" id="nb-baliser" onclick="showPg('baliser')">
    🔍
    <span style="font-size:9px;">Baliser</span>
  </button>
  <button class="nb" id="nb-reglages" onclick="showPg('reglages')">
    ⚙️
    <span style="font-size:9px;">Réglages</span>
  </button>
</div>

<!-- Camera -->
<div id="cam">
  <video id="camv"></video>
  <div class="cctrl">
    <button class="ccls" onclick="closeCam()">Fermer</button>
    <span style="color:#fff;font-weight:600;font-size:12px;">Pointez vers le code</span>
    <button class="ccls" onclick="captureFrame()">Photo</button>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script>
'use strict';

// ── UTILITAIRES ────────────────────────────────────────
const $ = id => document.getElementById(id);
const lsSet = (k, v) => localStorage.setItem('bp_' + k, JSON.stringify(v));
const lsGet = k => { try { return JSON.parse(localStorage.getItem('bp_' + k) || 'null'); } catch(e) { return null; } };
const ne = s => String(s || '').replace(/[^\d]/g, '');

function toast(msg, type){
  const el = $('toast');
  el.textContent = msg;
  el.className = 'on ' + (type || '');
  setTimeout(() => el.classList.remove('on'), 3000);
}

function showPg(pg){
  document.querySelectorAll('.pg, .nb').forEach(e => e.classList.remove('on'));
  $('pg-' + pg).classList.add('on');
  $('nb-' + pg).classList.add('on');
}

// ── STOCKAGE LOCAL BADGES ────────────────────────────────
var badgesLocaux = lsGet('badges') || {};

function saveBadges(){
  lsSet('badges', badgesLocaux);
  renderBadgesList();
}

function renderBadgesList(){
  const cont = $('badges-list');
  const keys = Object.keys(badgesLocaux);
  
  if(keys.length === 0){
    cont.innerHTML = '<div class="emp"><p>Aucun employé enregistré</p></div>';
    return;
  }
  
  let html = '';
  keys.forEach(badgeCode => {
    const emp = badgesLocaux[badgeCode];
    html += '<div class="badge-item">' +
      '<div class="badge-info">' +
        '<div class="badge-nom">' + emp.nom + '</div>' +
        '<div class="badge-meta">Matricule: ' + emp.matricule + ' · Badge: ' + badgeCode + '</div>' +
        (emp.commentaire ? '<div class="badge-meta" style="color:var(--org);">💬 ' + emp.commentaire + '</div>' : '') +
      '</div>' +
      '<button class="btn-delete" onclick="deleteBadge(\'' + badgeCode + '\')">✕</button>' +
    '</div>';
  });
  cont.innerHTML = html;
}

function deleteBadge(badgeCode){
  if(!confirm('Supprimer cet employé ?')) return;
  delete badgesLocaux[badgeCode];
  saveBadges();
  toast('Employé supprimé', 'ok');
}

// ── SCAN BADGE ────────────────────────────────────────
var currentCamMode = null;
var videoStream = null;

function openCam(mode){
  currentCamMode = mode;
  $('cam').classList.add('on');
  
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
    .then(stream => {
      videoStream = stream;
      $('camv').srcObject = stream;
      startBarcodeDetection();
    })
    .catch(err => {
      toast('Erreur caméra: ' + err.message, 'er');
      closeCam();
    });
}

function closeCam(){
  if(videoStream){
    videoStream.getTracks().forEach(t => t.stop());
    videoStream = null;
  }
  $('cam').classList.remove('on');
}

function startBarcodeDetection(){
  if(!videoStream || !$('cam').classList.contains('on')) return;
  
  if('BarcodeDetector' in window){
    try {
      const bd = new BarcodeDetector({
        formats: ['ean_13', 'ean_8', 'code_128', 'code_39', 'upc_a', 'upc_e', 'qr_code']
      });
      
      const video = $('camv');
      bd.detect(video).then(barcodes => {
        if(barcodes.length > 0){
          onBarcodeDetected(barcodes[0].rawValue);
        } else {
          setTimeout(startBarcodeDetection, 500);
        }
      }).catch(() => setTimeout(startBarcodeDetection, 500));
    } catch(e){
      setTimeout(startBarcodeDetection, 500);
    }
  } else {
    setTimeout(startBarcodeDetection, 500);
  }
}

function onBarcodeDetected(code){
  $('badge-scan-code').value = code;
  closeCam();
  toast('Badge scanné: ' + code, 'ok');
}

function captureFrame(){
  const video = $('camv');
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0);
  
  canvas.toBlob(blob => {
    decodeImageFile(blob);
  });
}

function decodeImageFile(file){
  if(!file) return;
  toast('Analyse du code-barres...', '');
  
  const url = URL.createObjectURL(file);
  const img = new Image();
  
  img.onload = function(){
    if('BarcodeDetector' in window){
      try {
        const bd = new BarcodeDetector({
          formats: ['ean_13', 'ean_8', 'code_128', 'code_39', 'upc_a', 'upc_e', 'qr_code']
        });
        bd.detect(img).then(barcodes => {
          URL.revokeObjectURL(url);
          if(barcodes.length > 0){
            onBarcodeDetected(barcodes[0].rawValue);
          } else {
            toast('Code non détecté', 'er');
          }
        }).catch(() => {
          URL.revokeObjectURL(url);
          toast('Code non détecté', 'er');
        });
        return;
      } catch(e){}
    }
    
    try {
      const canvas = document.createElement('canvas');
      const maxW = 1280;
      const scale = img.width > maxW ? maxW / img.width : 1;
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      
      if('BarcodeDetector' in window){
        const bd2 = new BarcodeDetector({
          formats: ['ean_13', 'ean_8', 'code_128', 'code_39', 'upc_a', 'upc_e', 'qr_code']
        });
        bd2.detect(canvas).then(barcodes => {
          if(barcodes.length > 0){
            onBarcodeDetected(barcodes[0].rawValue);
          } else {
            toast('Code non détecté', 'er');
          }
        }).catch(() => {
          toast('Code non détecté', 'er');
        });
      } else {
        toast('Scan non supporté', 'er');
      }
    } catch(e){
      URL.revokeObjectURL(url);
      toast('Erreur décodage', 'er');
    }
  };
  
  img.onerror = () => {
    URL.revokeObjectURL(url);
    toast('Erreur lecture image', 'er');
  };
  
  img.src = url;
}

// ── ENREGISTRER BADGE SCANNÉ ────────────────────────────
function saveBadgeScanned(){
  const nom = $('badge-nom').value.trim();
  const matricule = $('badge-matricule').value.trim();
  const badgeCode = $('badge-scan-code').value.trim();
  
  if(!nom || !matricule || !badgeCode){
    toast('Complétez tous les champs', 'er');
    return;
  }
  
  // Vérifier si badge existe déjà
  if(badgesLocaux[badgeCode]){
    toast('Ce badge existe déjà', 'er');
    return;
  }
  
  // Ajouter en local
  badgesLocaux[badgeCode] = {
    nom: nom,
    matricule: matricule,
    commentaire: '',
    dateAjout: new Date().toISOString().split('T')[0]
  };
  
  saveBadges();
  
  // Réinitialiser les champs
  $('badge-nom').value = '';
  $('badge-matricule').value = '';
  $('badge-scan-code').value = '';
  
  toast('Employé enregistré!', 'ok');
  
  // Vérifier si on doit exporter cette semaine
  checkAndExportBadgesThisWeek();
}

// ── EXPORT BADGES HEBDO ────────────────────────────────
function getLastBadgeExportDate(){
  return lsGet('last_badge_export_date');
}

function setLastBadgeExportDate(date){
  lsSet('last_badge_export_date', date);
}

function shouldExportBadgesThisWeek(){
  const lastExport = getLastBadgeExportDate();
  if(!lastExport) return true;
  
  const lastDate = new Date(lastExport);
  const today = new Date();
  const daysAgo = Math.floor((today - lastDate) / (1000 * 60 * 60 * 24));
  
  return daysAgo >= 7;
}

function checkAndExportBadgesThisWeek(){
  if(!shouldExportBadgesThisWeek()) return;
  
  const keys = Object.keys(badgesLocaux);
  if(keys.length === 0) return;
  
  // On a des badges à exporter
  exportBadgesAsXLSX();
  setLastBadgeExportDate(new Date().toISOString());
}

function exportBadgesAsXLSX(){
  const now = new Date();
  const dateStr = now.toLocaleDateString('fr-FR').replace(/\//g, '-');
  const fname = 'badges_semaine_' + dateStr + '.xlsx';
  
  // Construire les données
  const rows = [['nom', 'matricule', 'n°badge', 'commentaire']];
  
  Object.keys(badgesLocaux).forEach(badgeCode => {
    const emp = badgesLocaux[badgeCode];
    rows.push([
      emp.nom,
      emp.matricule,
      badgeCode,
      emp.commentaire || ''
    ]);
  });
  
  // Créer le workbook
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(rows);
  XLSX.utils.book_append_sheet(wb, ws, 'Badges');
  
  // Envoyer à Drive si connecté
  if(googleToken){
    exportXLSXToDrive(wb, fname);
  } else {
    // Juste télécharger localement
    XLSX.writeFile(wb, fname);
    toast('Fichier téléchargé', 'ok');
  }
}

function exportXLSXToDrive(workbook, fname){
  const folderId = lsGet('balisage_folder_id');
  if(!folderId) return;
  
  // Convertir en blob
  const wbout = XLSX.write(workbook, { bookType: 'xlsx', type: 'array' });
  const blob = new Blob([wbout], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  
  const metadata = {
    name: fname,
    mimeType: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
    parents: [folderId]
  };
  
  const form = new FormData();
  form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
  form.append('file', blob);
  
  fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + googleToken },
    body: form
  })
  .then(r => r.json())
  .then(data => {
    if(data.id){
      console.log('Fichier badges exporté:', fname);
      toast('Badges exportés sur Drive', 'ok');
    }
  })
  .catch(err => {
    console.error('Erreur export Drive:', err);
    toast('Erreur export Drive', 'er');
  });
}

// ── INFORMATION MAGASIN ────────────────────────────────
function saveShopInfo(){
  const name = $('shop-name').value.trim();
  const email = $('shop-email').value.trim();
  
  if(!name || !email){
    toast('Remplissez tous les champs', 'er');
    return;
  }
  
  lsSet('shop_name', name);
  lsSet('shop_email', email);
  toast('Magasin enregistré', 'ok');
  updateHeader();
}

// ── HEADER - AFFICHER UTILISATEUR ─────────────────────
function updateHeader(){
  const userEl = $('hdr-user');
  const badgeEl = $('hdr-badge');
  
  // Chercher le badge actuellement sélectionné (premier de la liste)
  const keys = Object.keys(badgesLocaux);
  if(keys.length > 0){
    const firstBadgeCode = keys[0];
    const emp = badgesLocaux[firstBadgeCode];
    
    userEl.textContent = emp.nom + ' · ' + emp.matricule;
    badgeEl.textContent = 'Badge: ' + firstBadgeCode;
    
    userEl.style.display = 'block';
    badgeEl.style.display = 'block';
  } else {
    userEl.style.display = 'none';
    badgeEl.style.display = 'none';
  }
}

// ── GOOGLE AUTHENTIFICATION ────────────────────────────
var googleToken = lsGet('google_token') || null;

function startGoogleLogin(){
  if(!window.google){
    toast('Google API pas chargée', 'er');
    return;
  }
  
  if(googleToken){
    googleToken = null;
    lsSet('google_token', null);
    $('google-status').style.display = 'none';
    toast('Déconnecté', 'ok');
    return;
  }
  
  google.accounts.id.initialize({
    client_id: 'YOUR_GOOGLE_CLIENT_ID_HERE',
    callback: handleGoogleLogin
  });
  
  google.accounts.id.renderButton($('btn-google-login'), {
    theme: 'outline',
    size: 'large'
  });
}

function handleGoogleLogin(response){
  googleToken = response.credential;
  lsSet('google_token', googleToken);
  $('google-status').style.display = 'block';
  toast('Connecté à Google', 'ok');
  
  // Créer le dossier Balisage TPC
  createBalisageFolder();
}

function createBalisageFolder(){
  const shopName = lsGet('shop_name') || 'Magasin';
  const folderName = 'Balisage TPC - ' + shopName;
  
  const metadata = { name: folderName, mimeType: 'application/vnd.google-apps.folder' };
  
  fetch('https://www.googleapis.com/drive/v3/files', {
    method: 'POST',
    headers: {
      'Authorization': 'Bearer ' + googleToken,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(metadata)
  })
  .then(r => r.json())
  .then(data => {
    if(data.id){
      lsSet('balisage_folder_id', data.id);
      console.log('Dossier créé:', data.id);
    }
  })
  .catch(err => console.error('Erreur création dossier:', err));
}

// ── IMPORT STOCK ────────────────────────────────────────
$('imp-file').addEventListener('change', function(e){
  const file = e.target.files[0];
  if(!file) return;
  
  const reader = new FileReader();
  reader.onload = function(evt){
    try {
      const data = new Uint8Array(evt.target.result);
      const workbook = XLSX.read(data, { type: 'array' });
      const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });
      
      // Traiter les données
      processImportedStock(rows);
    } catch(err){
      toast('Erreur lecture fichier', 'er');
    }
  };
  reader.readAsArrayBuffer(file);
});

function processImportedStock(rows){
  // À implémenter selon besoin
  toast(rows.length + ' lignes importées', 'ok');
}
