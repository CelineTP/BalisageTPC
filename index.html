<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1A2B3C">
<title>Balisage TPC</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.js"></script>
<style>
:root{--navy:#1A2B3C;--org:#FF6B35;--org2:#FFF0EB;--grn:#2ECC71;--grn2:#E8F8F0;--bg:#F0F4F8;--card:#fff;--txt:#1A2B3C;--mut:#6B7A8D;--brd:#DDE3EC;--red:#E53E3E;--red2:#FEF2F2;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--txt);display:flex;flex-direction:column;}
#hdr{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.2);}
.logo{font-family:'Barlow Condensed',sans-serif;font-size:21px;font-weight:800;color:#fff;}
.logo b{color:var(--org);}
.sinfo{margin-left:auto;text-align:right;font-size:11px;color:rgba(255,255,255,.6);line-height:1.4;}
.sinfo strong{display:block;color:rgba(255,255,255,.9);font-size:13px;}
#main{flex:1;overflow-y:auto;padding:16px 16px 84px;}
#nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--brd);display:flex;z-index:50;}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px 10px;border:none;background:none;cursor:pointer;font-size:10px;font-weight:500;color:var(--mut);}
.nb.on{color:var(--org);}
.nb.on::after{content:'';position:absolute;top:0;left:20%;right:20%;height:3px;background:var(--org);}
.pg{display:none;}.pg.on{display:block;}
.card{background:var(--card);border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,.08);padding:16px;margin-bottom:12px;}
.ctit{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--mut);margin-bottom:12px;}
.szn{background:linear-gradient(135deg,#1A2B3C,#2d4a6b);border-radius:14px;padding:16px;margin-bottom:12px;}
.slbl{color:rgba(255,255,255,.6);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px;}
.srow{display:flex;gap:8px;}
.si{flex:1;padding:12px 14px;border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);border-radius:8px;color:#fff;font-size:14px;outline:none;}
.si::placeholder{color:rgba(255,255,255,.4);}
.si:focus{border-color:var(--org);}
.bcam{padding:12px 14px;background:var(--org);border:none;border-radius:8px;color:#fff;cursor:pointer;font-size:16px;flex-shrink:0;}
.bsearch{padding:12px 14px;background:rgba(255,255,255,.2);border:none;border-radius:8px;color:#fff;cursor:pointer;font-size:16px;flex-shrink:0;}
.btn{padding:11px 18px;border-radius:8px;border:none;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;}
.btn:active{opacity:.8;}
.bP{background:var(--org);color:#fff;}
.bS{background:var(--bg);color:var(--txt);border:1px solid var(--brd);}
.bN{background:var(--navy);color:#fff;}
.bG{background:#1a73e8;color:#fff;}
.bD{background:var(--red2);color:var(--red);}
.bB{display:block;width:100%;margin-bottom:10px;}
.bSm{padding:8px 12px;font-size:12px;}
.fg{margin-bottom:14px;}
.fl{display:block;font-size:11px;font-weight:600;color:var(--mut);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px;}
.fi{width:100%;padding:11px 14px;border:1px solid var(--brd);border-radius:8px;font-size:14px;font-family:'Inter',sans-serif;outline:none;}
.fi:focus{border-color:var(--org);background:var(--org2);}
.toast{position:fixed;bottom:100px;left:16px;right:16px;padding:12px 16px;border-radius:8px;font-size:13px;font-weight:600;z-index:1000;animation:slideUp .3s ease;max-width:calc(100% - 32px);}
.toast.ok{background:var(--grn2);color:var(--grn);}
.toast.er{background:var(--red2);color:var(--red);}
@keyframes slideUp{from{transform:translateY(100px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:999;}
.modal-overlay.on{display:flex;}
.modal-content{background:#fff;border-radius:16px;padding:24px;max-width:90%;max-height:90vh;overflow-y:auto;box-shadow:0 10px 40px rgba(0,0,0,.3);}
.sr{display:flex;align-items:center;gap:12px;padding:14px;background:var(--bg);border-radius:8px;margin-bottom:12px;}
.si2{width:48px;height:48px;border-radius:8px;background:var(--grn2);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;}
.slb{font-weight:600;color:var(--txt);font-size:13px;}
.sds{font-size:11px;color:var(--mut);margin-top:2px;}
.emp{text-align:center;padding:40px 20px;color:var(--mut);}
</style>
</head>
<body>

<div id="hdr">
  <div class="logo">Balisage <b>TPC</b></div>
  <div class="sinfo"><strong id="hdr-user-name">—</strong></div>
  <button class="btn bS bSm" id="btn-switch-user" style="margin-left:8px;">🔄</button>
</div>

<!-- MODALE DÉMARRAGE -->
<div id="modal-start" class="modal-overlay on">
  <div class="modal-content" style="text-align:center;min-width:300px;">
    <div style="font-size:20px;font-weight:700;margin-bottom:24px;">🔐 Scanner votre badge</div>
    <div style="font-size:13px;color:var(--mut);margin-bottom:20px;">Qui utilise le téléphone?</div>
    
    <div style="display:flex;gap:10px;margin-bottom:16px;">
      <input type="text" id="badge-input-start" placeholder="Scannez..." style="flex:1;padding:12px;border:2px solid var(--brd);border-radius:8px;font-size:14px;" autocomplete="off" autofocus>
      <button class="btn bP" id="btn-cam-start">📷</button>
    </div>
    
    <div style="font-size:12px;color:var(--mut);padding:12px;background:var(--bg);border-radius:8px;margin-bottom:16px;">
      Badge scanné: <strong id="start-badge-display">—</strong>
    </div>
    
    <div id="start-badge-form" style="display:none;text-align:left;margin-top:20px;">
      <div style="background:var(--red2);padding:12px;border-radius:8px;margin-bottom:16px;font-size:12px;color:var(--red);">
        ⚠️ Badge non reconnu - Enregistrez-le
      </div>
      <div class="fg"><label class="fl">Nom</label><input type="text" id="start-name" class="fi" placeholder="Ex: Jean Dupont"></div>
      <div class="fg"><label class="fl">N° Badge</label><input type="text" id="start-num" class="fi" placeholder="Ex: 232"></div>
      <div class="fg"><label class="fl">Commentaire (optionnel)</label><input type="text" id="start-comment" class="fi" placeholder="Ex: Renfort"></div>
      <button class="btn bP bB" onclick="registerBadgeStart()">✅ Enregistrer et continuer</button>
    </div>
  </div>
</div>

<div id="main">

<div class="pg on" id="pg-consulter">
  <div class="szn">
    <div class="slbl">Rechercher un article</div>
    <div class="srow">
      <input class="si" type="text" id="scan-in" placeholder="Code, code-barres ou libellé..." autocomplete="off">
      <button class="bsearch" id="btn-search">🔎</button>
      <button class="bcam" id="btn-cam-search">📷</button>
    </div>
  </div>
  <div id="art-zone"></div>
</div>

<div class="pg" id="pg-baliser">
  <div id="badge-display" style="background:var(--grn2);border-left:4px solid var(--grn);padding:12px;margin-bottom:12px;border-radius:6px;display:none;">
    <div style="font-size:12px;color:var(--mut);">Utilisateur</div>
    <div style="font-size:15px;font-weight:700;color:var(--grn);" id="badge-text"></div>
  </div>
  <div style="display:flex;gap:10px;margin-bottom:16px;">
    <div style="font-size:18px;font-weight:700;">Listes</div>
    <button class="btn bP bSm" id="btn-newlist">+ Nouvelle</button>
  </div>
  <div id="lists-wrap"></div>
</div>

<div class="pg" id="pg-detail">
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;">
    <button class="btn bS bSm" id="btn-back">← Retour</button>
    <div style="flex:1;"><div id="det-name" style="font-size:17px;font-weight:700;"></div><div id="det-info" style="font-size:12px;color:var(--mut);"></div></div>
  </div>
  <div class="szn" style="padding:14px;">
    <div class="slbl">Ajouter un article</div>
    <div class="srow">
      <input class="si" type="text" id="scan-list" placeholder="Code ou code-barres..." autocomplete="off">
      <button class="bsearch" id="btn-search-list">🔎</button>
      <button class="bcam" id="btn-cam-list">📷</button>
    </div>
  </div>
  <div id="det-arts" style="margin-bottom:12px;"></div>
  <button class="btn bG bB" id="btn-send-gmail">📧 Envoyer par Gmail + Drive</button>
  <button class="btn bD bSm bB" id="btn-del-list">🗑️ Supprimer</button>
</div>

<div class="pg" id="pg-reglages">
  <div style="font-size:18px;font-weight:700;margin-bottom:16px;">Réglages</div>
  
  <div class="card">
    <div class="ctit">Informations magasin</div>
    <div class="fg"><label class="fl">Nom du magasin</label><input class="fi" type="text" id="inp-sn" placeholder="Ex : TAHITI PAS CHER ARUE"></div>
    <div class="fg"><label class="fl">Email</label><input class="fi" type="email" id="inp-email" placeholder="Ex : tpcarue@gmail.com"></div>
  </div>

  <div class="card">
    <div class="ctit">Gestion des badges</div>
    <button class="btn bN bB" id="btn-scan-badge">📷 Scanner et enregistrer</button>
    <div id="badges-list"></div>
  </div>

  <div class="card">
    <div class="ctit">Stock &amp; catalogue</div>
    <div class="sr">
      <div class="si2">📁</div>
      <div style="flex:1;"><div class="slb">Importer CSV stock</div></div>
      <button class="btn bP bSm" id="btn-import-stock">Importer</button>
      <input type="file" id="csv-stock" accept=".csv" style="display:none">
    </div>
    <div id="stock-status" style="display:none;font-size:12px;color:var(--mut);margin-top:8px;"></div>
  </div>
</div>

</div>

<div id="nav">
  <button class="nb on" id="nb-consulter"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>Consulter</button>
  <button class="nb" id="nb-baliser"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="2"/></svg>Baliser</button>
  <button class="nb" id="nb-reglages"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v6m0 6v6M4.22 4.22l4.24 4.24m3.08 3.08l4.24 4.24M1 12h6m6 0h6m-16.78 7.78l4.24-4.24m3.08-3.08l4.24-4.24"/></svg>Réglages</button>
</div>

<script>
// ===== HELPERS =====
function $(id){ return document.getElementById(id); }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function lsGet(k){ try{ var v=localStorage.getItem(k); if(v!==null) return v; }catch(e){} return null; }

// ===== VARIABLES GLOBALES =====
var articles = [];
var lists = [];
var listActuel = null;
var badgeActuel = null;
var magasinNom = '';
var userEmail = '';
var badgesLocaux = {};
var camMode = null;
var camOn = false;
var camCanvas = null;
var camCtx = null;
var camVideo = null;
var camStream = null;

// ===== INIT =====
function init(){
  loadData();
  setupEvents();
  checkBadgeStart();
}

function loadData(){
  badgesLocaux = JSON.parse(lsGet('bp_badges_locaux') || '{}');
  articles = JSON.parse(lsGet('bp_stock') || '[]');
  lists = JSON.parse(lsGet('bp_lists') || '[]');
  badgeActuel = lsGet('bp_badge_actuel') || null;
  magasinNom = lsGet('bp_magasin_nom') || 'TAHITI PAS CHER';
  userEmail = lsGet('bp_user_email') || '';
  
  $('inp-sn').value = magasinNom;
  $('inp-email').value = userEmail;
  updateHeader();
}

function saveData(){
  lsSet('bp_badges_locaux', JSON.stringify(badgesLocaux));
  lsSet('bp_stock', JSON.stringify(articles));
  lsSet('bp_lists', JSON.stringify(lists));
  lsSet('bp_badge_actuel', badgeActuel || '');
  lsSet('bp_magasin_nom', magasinNom);
  lsSet('bp_user_email', userEmail);
}

// ===== DÉMARRAGE =====
function checkBadgeStart(){
  $('badge-input-start').focus();
}

function processBadgeStart(code){
  code = code.trim().replace(/[\s\r\n]/g, '').substring(0, 50);
  $('badge-input-start').value = '';
  $('start-badge-display').textContent = code;
  
  if(badgesLocaux[code]){
    badgeActuel = code;
    saveData();
    $('modal-start').classList.remove('on');
    updateHeader();
  } else {
    $('start-badge-form').style.display = 'block';
    $('start-name').focus();
  }
}

$('badge-input-start').addEventListener('keypress', function(e){
  if(e.key === 'Enter' && this.value.trim()){
    processBadgeStart(this.value);
  }
});

$('btn-cam-start').onclick = function(){
  openCam('badge-start');
};

function registerBadgeStart(){
  var code = $('start-badge-display').textContent.trim();
  var nom = $('start-name').value.trim();
  var num = $('start-num').value.trim();
  var comment = $('start-comment').value.trim();
  
  if(!code || !nom || !num){ alert('Tous les champs requis'); return; }
  
  badgesLocaux[code] = { nom: nom, numBadge: num, commentaire: comment, dateAjout: new Date().toISOString().split('T')[0] };
  badgeActuel = code;
  saveData();
  $('modal-start').classList.remove('on');
  updateHeader();
  toast('✅ Badge enregistré!', 'ok');
}

// ===== HEADER =====
function updateHeader(){
  if(badgeActuel && badgesLocaux[badgeActuel]){
    $('hdr-user-name').textContent = badgesLocaux[badgeActuel].nom;
  } else {
    $('hdr-user-name').textContent = '—';
  }
}

$('btn-switch-user').onclick = function(){
  $('modal-start').classList.add('on');
  $('start-badge-form').style.display = 'none';
  $('badge-input-start').value = '';
  $('start-badge-display').textContent = '—';
  $('start-name').value = '';
  $('start-num').value = '';
  $('start-comment').value = '';
  $('badge-input-start').focus();
};

// ===== CAMÉRA =====
function openCam(mode){
  camMode = mode;
  camOn = true;
  
  var div = document.createElement('div');
  div.id = 'cam-modal';
  div.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#000;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;';
  
  camVideo = document.createElement('video');
  camVideo.style.cssText = 'width:100%;max-width:400px;height:auto;border-radius:8px;margin-bottom:16px;';
  camVideo.setAttribute('playsinline', 'true');
  camVideo.setAttribute('autoplay', 'true');
  
  camCanvas = document.createElement('canvas');
  camCtx = camCanvas.getContext('2d');
  
  var btn = document.createElement('button');
  btn.className = 'btn bD';
  btn.textContent = '✕ Fermer';
  btn.onclick = closeCam;
  
  div.appendChild(camVideo);
  div.appendChild(camCanvas);
  div.appendChild(btn);
  document.body.appendChild(div);
  
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
    .then(function(stream){
      camStream = stream;
      camVideo.srcObject = stream;
      camVideo.play();
      scanContinuous();
    })
    .catch(function(err){
      alert('Erreur caméra: ' + err.message);
      closeCam();
    });
}

function closeCam(){
  camOn = false;
  if(camStream) camStream.getTracks().forEach(x => x.stop());
  var m = document.getElementById('cam-modal');
  if(m) m.remove();
}

function scanContinuous(){
  if(!camOn) return;
  
  camCanvas.width = camVideo.videoWidth;
  camCanvas.height = camVideo.videoHeight;
  camCtx.drawImage(camVideo, 0, 0, camCanvas.width, camCanvas.height);
  
  var data = camCtx.getImageData(0, 0, camCanvas.width, camCanvas.height);
  var code = jsQR(data.data, data.width, data.height);
  
  if(code){
    closeCam();
    processScan(code.data);
  } else {
    requestAnimationFrame(scanContinuous);
  }
}

function processScan(result){
  result = result.trim();
  if(camMode === 'badge-start') processBadgeStart(result);
  else if(camMode === 'search'){ $('scan-in').value = result; $('btn-search').click(); }
  else if(camMode === 'list'){ $('scan-list').value = result; $('btn-search-list').click(); }
}

// ===== ARTICLES =====
function displayArticle(art){
  var siteNames = ['Entrepôt', 'TPC VILLE', 'TPC PUNA', 'TPC TRVO', 'TPC PAO', 'TPC ARUE', 'TPC MOOREA'];
  var siteValues = [art.site0, art.site1, art.site2, art.site3, art.site4, art.site5, art.site6];
  var stocks = [];
  for(var i = 0; i < 7; i++){
    if(siteValues[i] > 0) stocks.push(siteNames[i] + ': ' + siteValues[i]);
  }
  
  var html = '<div class="card" onclick="addToList(' + articles.indexOf(art) + ')" style="cursor:pointer;">';
  html += '<div style="font-weight:600;font-size:14px;">' + art.libelle;
  if(art.PPN) html += ' <span style="color:var(--red);font-weight:700;font-size:12px;">⚠️ PPN</span>';
  html += '</div>';
  html += '<div style="font-size:11px;color:var(--mut);margin-top:4px;">Code: ' + art.code + ' | Code-barres: ' + (art.codebarre || '—') + '</div>';
  html += '<div style="font-size:16px;font-weight:700;color:var(--org);margin-top:8px;">' + (art.prix_vente || 0) + ' XPF</div>';
  html += '<div style="font-size:11px;color:var(--mut);margin-top:8px;">Stock global: ' + (art.conso || 0) + '</div>';
  if(stocks.length > 0){
    html += '<div style="font-size:10px;color:var(--mut);margin-top:6px;">' + stocks.join(' | ') + '</div>';
  }
  if(art.PPN){
    html += '<div style="font-size:11px;color:var(--red);margin-top:8px;padding:6px;background:var(--red2);border-radius:4px;font-weight:600;">🔴 PRODUIT PREMIÈRE NÉCESSITÉ - Vérifier balisage en rayon</div>';
  }
  html += '</div>';
  return html;
}

function searchArticles(q){
  if(!q) return [];
  q = q.toLowerCase();
  return articles.filter(x => x.code.includes(q) || x.libelle.toLowerCase().includes(q) || (x.codebarre && x.codebarre.includes(q)));
}

$('btn-search').onclick = function(){
  var q = $('scan-in').value.trim();
  var res = searchArticles(q);
  $('art-zone').innerHTML = res.length > 0 ? res.map(displayArticle).join('') : '<div class="emp"><p>Aucun résultat</p></div>';
};

$('scan-in').addEventListener('keypress', function(e){
  if(e.key === 'Enter') $('btn-search').click();
});

$('btn-cam-search').onclick = function(){ openCam('search'); };

// ===== LISTES =====
function renderLists(){
  var html = '';
  if(lists.length === 0){
    html = '<div class="emp"><p>Créez une liste pour commencer</p></div>';
  } else {
    lists.forEach(function(l){
      html += '<div class="card" onclick="openList(' + l.id + ')" style="cursor:pointer;"><div style="font-weight:600;">' + l.nom + '</div><div style="font-size:11px;color:var(--mut);margin-top:4px;">' + (l.articles ? l.articles.length : 0) + ' articles</div></div>';
    });
  }
  $('lists-wrap').innerHTML = html;
}

$('btn-newlist').onclick = function(){
  var nom = prompt('Nom de la liste:');
  if(!nom) return;
  var list = { id: Date.now(), nom: nom, articles: [], dateCreation: new Date().toISOString() };
  lists.push(list);
  saveData();
  openList(list.id);
};

function openList(id){
  listActuel = id;
  showPg('detail');
  updateDetail();
}

function updateDetail(){
  var list = lists.find(x => x.id === listActuel);
  if(!list) return;
  $('det-name').textContent = list.nom;
  $('det-info').textContent = list.articles.length + ' article(s)';
  
  var html = '';
  if(list.articles.length === 0){
    html = '<div style="text-align:center;padding:20px;color:var(--mut);">Aucun article</div>';
  } else {
    list.articles.forEach(function(a, i){
      html += '<div class="card" style="display:flex;justify-content:space-between;align-items:center;"><div><div style="font-weight:600;">' + a.libelle + '</div><div style="font-size:11px;color:var(--mut);">Code: ' + a.code + '</div></div><div style="text-align:right;"><div style="font-weight:700;font-size:14px;">' + a.quantite + 'x</div><button class="btn bD bSm" onclick="delFromList(' + i + ')">✕</button></div></div>';
    });
  }
  $('det-arts').innerHTML = html;
}

function addToList(idx){
  if(!listActuel || idx < 0 || idx >= articles.length) return;
  var list = lists.find(x => x.id === listActuel);
  if(!list) return;
  
  var art = articles[idx];
  var existing = list.articles.find(x => x.code === art.code);
  
  if(existing) existing.quantite++;
  else list.articles.push({ code: art.code, libelle: art.libelle, codebarre: art.codebarre, quantite: 1 });
  
  saveData();
  updateDetail();
}

function delFromList(i){
  var list = lists.find(x => x.id === listActuel);
  if(!list) return;
  list.articles.splice(i, 1);
  saveData();
  updateDetail();
}

$('btn-search-list').onclick = function(){
  var q = $('scan-list').value.trim();
  var res = searchArticles(q);
  if(res.length === 0){ alert('Aucun article'); return; }
  if(res.length === 1){ addToList(articles.indexOf(res[0])); $('scan-list').value = ''; updateDetail(); }
  else alert('Plusieurs résultats');
};

$('scan-list').addEventListener('keypress', function(e){
  if(e.key === 'Enter') $('btn-search-list').click();
});

$('btn-cam-list').onclick = function(){ openCam('list'); };

$('btn-send-gmail').onclick = function(){
  if(!badgeActuel || !badgesLocaux[badgeActuel]){ alert('Badge obligatoire'); return; }
  if(!listActuel) return;
  
  var list = lists.find(x => x.id === listActuel);
  if(!list || list.articles.length === 0){ alert('Liste vide'); return; }
  
  var rows = [['code-barres', 'libelle', 'quantite']];
  list.articles.forEach(a => rows.push([a.codebarre || '', a.libelle, a.quantite]));
  
  var ws = XLSX.utils.aoa_to_sheet(rows);
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Balisage');
  
  var dateStr = new Date().toISOString().split('T')[0];
  XLSX.writeFile(wb, 'balisage_' + dateStr + '.xlsx');
  
  lists = lists.filter(x => x.id !== listActuel);
  listActuel = null;
  saveData();
  renderLists();
  showPg('baliser');
  toast('✅ Fichier généré!', 'ok');
};

$('btn-del-list').onclick = function(){
  if(!confirm('Supprimer?')) return;
  lists = lists.filter(x => x.id !== listActuel);
  listActuel = null;
  saveData();
  renderLists();
  showPg('baliser');
};

$('btn-back').onclick = function(){ showPg('baliser'); renderLists(); };

// ===== RÉGLAGES =====
$('inp-sn').onchange = function(){ magasinNom = this.value; saveData(); };
$('inp-email').onchange = function(){ userEmail = this.value; saveData(); };

$('btn-scan-badge').onclick = function(){
  openCam('badge-settings');
};

function renderBadges(){
  var html = '';
  var keys = Object.keys(badgesLocaux);
  if(keys.length === 0){
    html = '<div style="text-align:center;padding:20px;color:var(--mut);">Aucun badge</div>';
  } else {
    keys.forEach(k => {
      var b = badgesLocaux[k];
      html += '<div class="card"><div style="display:flex;justify-content:space-between;"><div><div style="font-weight:600;">' + b.nom + '</div><div style="font-size:11px;color:var(--mut);">N°: ' + b.numBadge + ' | Badge: ' + k + '</div></div><button class="btn bD bSm" onclick="delBadge(\'' + k + '\')">✕</button></div></div>';
    });
  }
  $('badges-list').innerHTML = html;
};

function delBadge(k){
  if(!confirm('Supprimer?')) return;
  delete badgesLocaux[k];
  saveData();
  renderBadges();
}

// ===== IMPORT =====
$('btn-import-stock').onclick = function(){ $('csv-stock').click(); };

$('csv-stock').onchange = function(e){
  var file = e.target.files[0];
  if(!file) return;
  
  var reader = new FileReader();
  reader.onload = function(evt){
    var lines = evt.target.result.split(/\r?\n/);
    articles = [];
    
    for(var i = 1; i < lines.length; i++){
      var line = lines[i].trim();
      if(!line) continue;
      
      var fields = line.split(';');
      if(fields.length < 13) continue;
      
      var prix = fields[12] ? parseInt(fields[12].replace(',', '.')) : 0;
      var ppn = fields.length > 50 ? parseInt(fields[50]) : 0;
      
      var art = {
        code: fields[0],
        libelle: fields[1],
        codebarre: fields[2],
        prix_vente: prix,
        conso: fields[28] ? parseInt(fields[28]) : 0,
        site0: fields[29] ? parseInt(fields[29]) : 0,
        site1: fields[31] ? parseInt(fields[31]) : 0,
        site2: fields[33] ? parseInt(fields[33]) : 0,
        site3: fields[35] ? parseInt(fields[35]) : 0,
        site4: fields[37] ? parseInt(fields[37]) : 0,
        site5: fields[39] ? parseInt(fields[39]) : 0,
        site6: fields[41] ? parseInt(fields[41]) : 0,
        PPN: ppn
      };
      
      if(art.code) articles.push(art);
    }
    
    saveData();
    $('stock-status').textContent = '✅ ' + articles.length + ' articles importés';
    $('stock-status').style.display = 'block';
    toast('✅ Stock importé!', 'ok');
  };
  reader.readAsText(file);
};

// ===== NAVIGATION =====
function showPg(n){
  document.querySelectorAll('.pg').forEach(x => x.classList.remove('on'));
  $('pg-' + n).classList.add('on');
  document.querySelectorAll('.nb').forEach(x => x.classList.remove('on'));
  $('nb-' + n).classList.add('on');
}

$('nb-consulter').onclick = function(){ showPg('consulter'); };
$('nb-baliser').onclick = function(){ showPg('baliser'); renderLists(); };
$('nb-reglages').onclick = function(){ showPg('reglages'); renderBadges(); };

// ===== TOAST =====
function toast(msg, type){
  var t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

// ===== SETUP =====
function setupEvents(){
  renderLists();
  renderBadges();
}

window.addEventListener('load', init);
</script>
